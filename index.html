const DYN=[['al','채용 연령'],['type','채용 시점'],['kind','고용형태'],['days','근무일'],['hours','근무시간'],['ins','근무조건(보험)']];
const QF=[['r','채용 진행 기업',c=>c.hire],['w','당일 채용',c=>c.hire&&c.nowHire],['x','경력 무관',c=>c.hire&&/무관/.test(c.exp)],['c','자격증·면허 불필요',c=>c.hire&&!/자격증|면허/.test(c.qual)],['i','4대보험 가입',c=>c.hire&&c.ins==='4대보험 가입'],['h','하루 7시간 이하',c=>c.hire&&!!c.hours&&c.hours!=='8시간 이상'],['d','주 3일 이하',c=>c.hire&&parseInt((c.days.match(/\d/)||[9])[0])<=3]];
const bd=c=>{const b=[];if(!c.hire)b.push(['w','채용 없음']);if(c.hire&&c.nowHire)b.push(['now','당일 채용']);if(c.hire&&c.exp)b.push(/무관/.test(c.exp)?['ok','경력 무관']:['w',c.exp]);if(c.hire&&c.edu==='학력무관')b.push(['ok','학력 무관']);else if(c.hire&&c.edu!=='미기재')b.push(['w',c.edu]);if(/자격증|면허/.test(c.qual))b.push(['w','자격증 필요']);if(c.ins==='4대보험 가입')b.push(['ok','4대보험']);return b.map(([t,x])=>`<span class="bd ${t}">${e(x)}</span>`).join('')};
const IC=['var(--ac)'];
let DATA=[],INDS=[],FAV=new Set();
try{FAV=new Set(JSON.parse(localStorage.getItem('fav')||'[]'));if(localStorage.getItem('big')==='1')setBig(true)}catch(x){}
function saveFav(){try{localStorage.setItem('fav',JSON.stringify([...FAV]))}catch(x){}}
function setBig(b){document.documentElement.classList.toggle('big',b);$('big').setAttribute('aria-pressed',b);try{localStorage.setItem('big',b?'1':'0')}catch(x){}}
function toast(t){const o=$('toast');o.textContent=t;o.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>o.style.display='none',3500)}
const cnt=(k,f)=>{const o={};DATA.forEach(c=>(f?c[k]:[c[k]]).forEach(v=>{if(v)o[v]=(o[v]||0)+1}));return Object.entries(o).sort((a,b)=>b[1]-a[1])};
function setData(d,src){
  d=d.filter(c=>c.name!=='추가예정');DATA=d;cur=null;if(PVON)ph();d.forEach((c,i)=>c.i=i);INDS=cnt('ind').map(x=>x[0]);
  Object.assign(S,{q:'',ind:'',tags:new Set(),qf:new Set(),age:0,sex:'',fav:false,al:'',type:'',kind:'',days:'',hours:'',ins:''});
  $('q').value='';$('age').value='';$('sex').value='';
  $('dyn').innerHTML=DYN.map(([k,l])=>`<label>${l}<select data-k="${k}"><option value="">전체</option>${cnt(k).map(([v,c])=>`<option value="${e(v)}">${e(v)} (${c})</option>`).join('')}</select></label>`).join('');
  $('more').innerHTML='';document.querySelectorAll('#dyn>label:nth-child(n+2)').forEach(l=>$('more').appendChild(l));$('qf').innerHTML=QF.map(([k,t,f])=>`<button data-q="${k}">${t}<em>${DATA.filter(f).length}</em></button>`).join('');$('chips').innerHTML=cnt('tags',1).map(([v,c])=>`<button data-t="${e(v)}">${e(v)}<em>${c}</em></button>`).join('');
  const tot=d.reduce((a,c)=>a+(c.n||0),0);
  $('sub').textContent=`총 ${d.length}개 기업 · 채용인원 ${tot.toLocaleString()}명${src?' · '+src:''}`;
  drawTabs();go();
}
function drawTabs(){$('tabs').innerHTML=`<button data-i="" class="${S.ind?'':'on'}">전체<em>${DATA.length}</em></button>`+INDS.map(v=>`<button data-i="${e(v)}" class="${S.ind===v?'on':''}">${e(v)}<em>${DATA.filter(c=>c.ind===v).length}</em></button>`).join('')}
function pass(c){
  if(S.q){const h=(c.name+' '+c.job+' '+c.loc+' '+c.qual+' '+c.pref+' '+c.ind+' '+c.tags.join(' ')).toLowerCase();if(!S.q.split(/\s+/).every(w=>h.includes(w)))return false}
  if(S.ind&&c.ind!==S.ind)return false;
  if(S.tags.size&&!c.tags.some(t=>S.tags.has(t)))return false;
  for(const k of ['al','type','kind','days','hours','ins'])if(S[k]&&c[k]!==S[k])return false;
  if(S.age&&c.maxAge<S.age)return false;
  if(S.sex&&c.sexOnly&&c.sexOnly!==S.sex)return false;
  for(const q of S.qf)if(!QF.find(x=>x[0]===q)[2](c))return false;
  if(S.fav&&!FAV.has(c.name))return false;
  return true;
}
const hc=c=>c.n==null?'-':c.n===0?'상시·협의':c.n+'명';
const col=c=>IC[Math.max(0,INDS.indexOf(c.ind))%IC.length];
const star=c=>`<button class="star ${FAV.has(c.name)?'on':''}" data-s="${c.i}" aria-label="관심기업 표시" title="관심기업">★</button>`;
function card(c){return`<article class="card" data-i="${c.i}" tabindex="0" style="--ic:${col(c)}"><div class="top"><span class="ind">${e(c.ind)}</span><span class="pill">${e(c.type)}</span>${star(c)}</div><h3>${e(c.name)}</h3><p class="job">${e(c.title)}</p><div class="tags">${c.tags.map(t=>`<span>${e(t)}</span>`).join('')}</div><div class="tags">${bd(c)}</div><dl class="kv"><div><dt>채용인원</dt><dd class="hc">${e(hc(c))}</dd></div><div><dt>고용형태</dt><dd>${e(c.kind)}</dd></div><div class="w"><dt>보수</dt><dd>${e(c.pay)}</dd></div><div><dt>연령</dt><dd>${e(c.age)}</dd></div><div><dt>근무</dt><dd>${e(dh(c))}</dd></div><div class="w"><dt>근무지</dt><dd>${e(c.loc)}</dd></div></dl></article>`}
const TH=[['name','기업명'],['ind','관'],['title','직무'],['kind','형태'],['pay','보수'],['n','인원'],['maxAge','채용연령'],['days','근무'],['loc','근무지']];
function table(l){const a=k=>S.sk===k?(S.sd>0?' ▲':' ▼'):'';return`<div class="tw"><table><thead><tr><th></th>${TH.map(([k,t])=>`<th data-sk="${k}">${t}${a(k)}</th>`).join('')}</tr></thead><tbody>${l.map(c=>`<tr data-i="${c.i}"><td>${star(c)}</td><td>${c.hire&&c.nowHire?'<i class="nw">당일</i>':''}<b>${e(c.name)}</b></td><td><i class="dot" style="background:${col(c)}"></i>${e(c.ind.replace(/^중장년\s*/,''))}</td><td title="${e(c.title)}">${e(c.title)}</td><td>${e(c.kind)}</td><td title="${e(c.pay)}">${e(c.pay)}</td><td class="num">${e(hc(c))}</td><td>${e(c.al)}</td><td>${e(dh(c))}</td><td title="${e(c.loc)}">${e(c.loc)}</td></tr>`).join('')}</tbody></table></div>`}
function go(){go0();act();if(pvOn()&&cur)detail(cur,1);else mark()}
function go0(){
  const l=DATA.filter(pass);
  if(S.sk){const d=S.sd,k=S.sk;l.sort((a,b)=>{let x=a[k],y=b[k];if(k==='n'){x=x??-1;y=y??-1}return d*(typeof x==='number'?x-y:String(x).localeCompare(String(y),'ko'))})}
  CUR=l.map(c=>c.i);$('cnt').textContent=`${DATA.length}개 중 ${l.length}개 기업${S.age?` · ${S.age}세 지원 가능`:''}`;
  $('out').innerHTML=l.length?(S.view==='card'?`<div class="cards">${l.map(card).join('')}</div>`:table(l)):`<div class="empty"><p><b>조건에 맞는 기업이 없어요.</b></p><p>필터를 줄이거나 검색어를 바꿔 보세요.</p><button class="btn" onclick="reset()">필터 초기화</button></div>`;
}
function reset(){Object.assign(S,{q:'',ind:'',tags:new Set(),qf:new Set(),age:0,sex:'',fav:false,al:'',type:'',kind:'',days:'',hours:'',ins:''});$('q').value='';$('age').value='';$('sex').value='';document.querySelectorAll('#dyn select,#more select').forEach(s=>s.value='');document.querySelectorAll('#chips .on,#qf .on').forEach(b=>b.classList.remove('on'));$('favb').classList.remove('on');drawTabs();go()}
let CUR=[],cur=null,PVON=true;
const pvOn=()=>PVON&&innerWidth>1100;
const ph=()=>{$('pv').innerHTML='<p class="ph"><b>미리보기</b><br>목록에서 회사를 누르면 여기에 보여요.<br>↑ ↓ 키로 다음 회사로 넘길 수 있어요.</p>'};
function mark(){if(!pvOn()||!cur)return;$('out').querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));const r=$('out').querySelector(`[data-i="${cur.i}"]`);if(r){r.classList.add('sel');r.scrollIntoView({block:'nearest'})}}
function act(){const a=[];if(S.q)a.push(['q','검색: '+S.q]);if(S.ind)a.push(['ind',S.ind]);S.tags.forEach(t=>a.push(['t:'+t,t]));if(S.age)a.push(['age',S.age+'세']);if(S.sex)a.push(['sex',S.sex==='F'?'여성':'남성']);for(const [k] of DYN)if(S[k])a.push([k,S[k]]);if(S.fav)a.push(['fav','관심기업']);$('act').innerHTML=a.length?a.map(([k,t])=>`<button data-x="${e(k)}" title="조건 해제">${e(t)} ✕</button>`).join(''):'<span class="cl">없음</span>'}
function setPv(b){PVON=b;document.documentElement.classList.toggle('pvon',b);$('pvb').classList.toggle('on',b);try{localStorage.setItem('pv',b?'1':'0')}catch(x){}if(b)cur&&pvOn()?detail(cur,1):ph()}
const nav=c=>{const i=CUR.indexOf(c.i);return`<div class="nav"><button class="btn" id="dp" ${i<1?'disabled':''}>◀ 이전</button><span>${i<0?'-':i+1} / ${CUR.length}</span><button class="btn" id="dz">크게 보기</button><button class="btn" id="dn" ${i>=CUR.length-1?'disabled':''}>다음 ▶</button></div>`};
function step(d){const i=CUR.indexOf(cur.i)+d;if(i>=0&&i<CUR.length)detail(DATA[CUR[i]],!$('dlg').open&&pvOn())}
function detail(c,pv){cur=c;pvHide();
  const row=(k,v)=>v&&v!=='-'?`<tr><th>${k}</th><td>${e(v)}</td></tr>`:'';
  $('dc').innerHTML=`${nav(c)}<div class="dh"><div><span class="ind" style="color:${col(c)}">${e(c.ind)}</span> <span class="pill">${e(c.type)}</span><h2>${e(c.name)}</h2></div><button class="x" id="dx" aria-label="닫기">✕</button></div><div class="tags">${c.tags.map(t=>`<span>${e(t)}</span>`).join('')}</div><div class="tags" style="margin-top:.4rem">${bd(c)}</div><div class="key"><div><small>보수</small><b>${e(c.pay)}</b></div><div><small>채용인원</small><b>${e(hc(c))}</b></div><div><small>채용 연령</small><b>${e(c.al)}</b></div><div><small>근무</small><b>${e(dh(c))}</b></div></div><h4>어떤 일인가요?</h4><p class="pre">${e(c.job)||'-'}</p><h4>조건 자세히 보기</h4><table class="dt">${row('보수',c.pay)}${row('고용형태',c.kind)}${row('채용인원',hc(c))}${row('연령',c.age)}${row('성별',c.sexT)}${row('학력',c.edu)}${row('경력',c.exp)}${row('근무일·시간',dh(c))}${row('근무조건',c.ins)}${row('근무지',c.loc)}${row('업종',c.biz)}${row('직원 수',c.emp?(+c.emp?(+c.emp).toLocaleString()+'명':c.emp):'')}</table>${c.qual?`<h4>이런 분을 찾아요</h4><p class="pre">${e(c.qual)}</p>`:''}${c.pref?`<h4>이런 경우 유리해요</h4><p class="pre">${e(c.pref)}</p>`:''}${c.intro?`<h4>회사 소개</h4><p class="pre">${e(c.intro)}</p>`:''}<div class="foot">${c.hp?`<a class="btn pri" href="${e(c.hp)}" target="_blank" rel="noopener">홈페이지 열기 ↗</a>`:''}<button class="btn" id="ds" data-i="${c.i}">${FAV.has(c.name)?'★ 관심 해제':'☆ 관심기업 담기'}</button></div>`;
  if(pv){$('pv').innerHTML=$('dc').innerHTML;mark();return}
  if(!$('dlg').open)$('dlg').showModal();
}
function toggleFav(c){FAV.has(c.name)?FAV.delete(c.name):FAV.add(c.name);saveFav()}
$('out').addEventListener('click',ev=>{const th=ev.target.closest('[data-sk]');if(th){const k=th.dataset.sk;S.sd=S.sk===k?-S.sd:1;S.sk=k;$('sort').value='no';go();return}
  const s=ev.target.closest('[data-s]');if(s){ev.stopPropagation();toggleFav(DATA[+s.dataset.s]);go();return}
  const r=ev.target.closest('[data-i]');if(r)detail(DATA[+r.dataset.i],pvOn());
});
$('out').addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.classList.contains('card'))detail(DATA[+ev.target.dataset.i],pvOn())});
$('dlg').addEventListener('click',ev=>{
  if(ev.target===$('dlg')||ev.target.id==='dx')$('dlg').close();
  if(ev.target.id==='dp')step(-1);if(ev.target.id==='dn')step(1);
  if(ev.target.id==='ds'){const c=DATA[+ev.target.dataset.i];toggleFav(c);detail(c);go()}
});
$('q').oninput=ev=>{S.q=ev.target.value.trim().toLowerCase();go()};
$('age').oninput=ev=>{S.age=+ev.target.value||0;go()};
$('sex').onchange=ev=>{S.sex=ev.target.value;go()};
$('sort').onchange=ev=>{const v=ev.target.value;S.sk={no:'',head:'n',name:'name',views:'views'}[v];S.sd=(v==='head'||v==='views')?-1:1;go()};
$('dyn').onchange=ev=>{S[ev.target.dataset.k]=ev.target.value;go()};
$('more').onchange=$('dyn').onchange;
$('tabs').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;S.ind=b.dataset.i;drawTabs();go()};
$('chips').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const t=b.dataset.t;S.tags.has(t)?S.tags.delete(t):S.tags.add(t);b.classList.toggle('on');go()};
$('qf').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const k=b.dataset.q;S.qf.has(k)?S.qf.delete(k):S.qf.add(k);b.classList.toggle('on');go()};
$('favb').onclick=()=>{S.fav=!S.fav;$('favb').classList.toggle('on',S.fav);$('favb').textContent=(S.fav?'★':'☆')+' 관심기업만';go()};
$('rst').onclick=reset;
document.querySelector('.seg').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;S.view=b.dataset.v;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));go()};
$('big').onclick=()=>setBig(!document.documentElement.classList.contains('big'));
async function load(f){
  if(typeof XLSX==='undefined'){toast('엑셀 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');return}
  try{
    const wb=XLSX.read(await f.arrayBuffer());
    const names=wb.SheetNames.includes('참여기업정보')?['참여기업정보']:wb.SheetNames;
    const seen=new Set(),d=[];
    names.forEach(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''}).forEach(r=>{const key=r['기업명']+'|'+(r['모집구분']||'');if(r['기업명']&&!seen.has(key)){seen.add(key);d.push(norm(r))}}));
    if(!d.length)throw 0;
    setData(d,f.name);toast(`${d.length}개 기업을 불러왔어요`);
  }catch(x){toast('"기업명" 열이 있는 엑셀 파일인지 확인해 주세요.')}
}
$('file').onchange=ev=>{if(ev.target.files[0])load(ev.target.files[0]);ev.target.value=''};
$('dlg').addEventListener('keydown',ev=>{if(ev.key==='ArrowRight')step(1);if(ev.key==='ArrowLeft')step(-1)});
function setDense(b){document.documentElement.classList.toggle('dense',b);$('dens').classList.toggle('on',b);try{localStorage.setItem('dense',b?'1':'0')}catch(x){}}
$('dens').onclick=()=>setDense(!document.documentElement.classList.contains('dense'));
let d0=true;try{d0=localStorage.getItem('dense')!=='0'}catch(x){}setDense(d0);
const cut=(s,n)=>s.length>n?s.slice(0,n)+'…':s;
let pvId=-1;
function pvShow(c,x,y){const p=$('hov');if(pvId!==c.i){pvId=c.i;p.innerHTML=`<b class="n">${e(c.name)}</b><div class="tags" style="margin:.3rem 0">${bd(c)}</div><h5>하는 일</h5><p>${e(cut(c.job,180))}</p>${c.qual?`<h5>이런 분을 찾아요</h5><p>${e(cut(c.qual,120))}</p>`:''}${c.pref?`<h5>이런 경우 유리해요</h5><p>${e(cut(c.pref,100))}</p>`:''}<h5>근무지</h5><p>${e(cut(c.loc,60))}</p>`}
  p.style.display='block';const w=p.offsetWidth,hh=p.offsetHeight;let l=x+16,t=y+16;if(l+w>innerWidth-8)l=x-w-16;if(l<8)l=8;if(t+hh>innerHeight-8)t=innerHeight-hh-8;if(t<8)t=8;p.style.left=l+'px';p.style.top=t+'px'}
function pvHide(){pvId=-1;$('hov').style.display='none'}
if(matchMedia('(hover:hover)').matches){
  $('out').addEventListener('mousemove',ev=>{if(pvOn()){pvHide();return}const r=ev.target.closest('[data-i]');if(!r||ev.target.closest('[data-s]')){pvHide();return}pvShow(DATA[+r.dataset.i],ev.clientX,ev.clientY)});
  $('out').addEventListener('mouseleave',pvHide);
}
addEventListener('scroll',pvHide,{passive:true});
$('pvb').onclick=()=>setPv(!PVON);
$('pv').addEventListener('click',ev=>{const t=ev.target.id;if(t==='dp')step(-1);else if(t==='dn')step(1);else if(t==='dz')detail(cur);else if(t==='ds'){toggleFav(cur);detail(cur,1);go()}});
$('dlg').addEventListener('close',()=>{if(pvOn()&&cur)detail(cur,1)});
addEventListener('keydown',ev=>{if(!pvOn()||$('dlg').open||/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName))return;if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();cur?step(ev.key==='ArrowDown'?1:-1):CUR.length&&detail(DATA[CUR[0]],1)}});
$('act').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const k=b.dataset.x;
  if(k==='q')S.q='';else if(k==='ind')S.ind='';else if(k.startsWith('t:'))S.tags.delete(k.slice(2));else if(k==='age')S.age=0;else if(k==='sex')S.sex='';else if(k==='fav')S.fav=false;else S[k]='';
  $('q').value=S.q;$('age').value=S.age||'';$('sex').value=S.sex;document.querySelectorAll('#dyn select,#more select').forEach(s=>s.value=S[s.dataset.k]);document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',S.tags.has(x.dataset.t)));$('favb').classList.toggle('on',S.fav);$('favb').textContent=(S.fav?'★':'☆')+' 관심기업';drawTabs();go()};
let p0=true;try{p0=localStorage.getItem('pv')!=='0'}catch(x){}setPv(p0);
let dc=0;
addEventListener('dragenter',ev=>{ev.preventDefault();dc++;$('drop').style.display='flex'});
addEventListener('dragleave',()=>{if(--dc<=0){dc=0;$('drop').style.display='none'}});
addEventListener('dragover',ev=>ev.preventDefault());
addEventListener('drop',ev=>{ev.preventDefault();dc=0;$('drop').style.display='none';const f=ev.dataTransfer.files[0];if(f)load(f)});
(()=>{const d=Math.round((new Date(2026,9,20)-new Date(new Date().toDateString()))/864e5);$('dday').textContent=d>0?`개최 D-${d}`:d===0?'오늘 개최!':'개최 완료'})();
setData(RAW.map(norm),'');if(innerWidth<820)$('side').open=false;
</script>
</body>
